{% macro datos(name,placeholder,type="text") %}
    <div class="mb-3">
        <label form="{{ name }}" class="form-label">{{ name }}:</label>
        <input type="{{ type }}" class="form-control" id="{{ name }}" name="{{ name }}"
        placeholder="{{ placeholder }}">
    </div>
{% endmacro %}

{% macro campoNuevo(field)%}
<td>{{field.label}}</td>
<dd>{{field(**kwargs) | safe}}<dd>
{% if field.errors%}
    {% for error in field.error%}
           <lil style="color: red;">{{error}}</lil>
    {%endfor%}
{%endif%}

{% endmacro %}
