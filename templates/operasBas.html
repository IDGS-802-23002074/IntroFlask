{% extends "layout.html" %}
{% block content %}

<h3 class="mb-3">Operaciones Básicas</h3>

<form action="/resultado" method="post">

    <div class="mb-3">
        <label for="n1" class="form-label">Número 1:</label>
        <input type="number" step="any" class="form-control" id="n1" name="n1" required>
    </div>

    <div class="mb-3">
        <label for="n2" class="form-label">Número 2:</label>
        <input type="number" step="any" class="form-control" id="n2" name="n2" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Seleccione la operación:</label><br>

        <input type="radio" name="operacion" value="suma" checked>
        <label>Suma</label><br>

        <input type="radio" name="operacion" value="resta">
        <label>Resta</label><br>

        <input type="radio" name="operacion" value="multiplicacion">
        <label>Multiplicación</label><br>

        <input type="radio" name="operacion" value="division">
        <label>División</label>
    </div>

    <button type="submit" class="btn btn-primary">Calcular</button>
</form>

{% endblock %}
